{{- /* vim: set ft=dosini: */ -}}

{{- $paths := includeTemplate "totalcmd/paths.json" . | fromJson }}
{{- $localAppData := $paths.localAppData }}
{{- $hex := includeTemplate "totalcmd/hexeditor.json" . | fromJson -}}

[em_baregrep]
{{- with $default := "%$UserProgramFiles%\\BareGrepPro\\BareGrepPro.exe" }}
{{-   with $program := (default $default (lookPath "BareGrepPro.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Grep in current directory
param=--directory "%P"

[em_baretail]
{{- with $default := "%$UserProgramFiles%\\BareTailPro\\BareTailPro.exe" }}
{{-   with $program := (default $default (lookPath "BareTailPro.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Tail selected files
param=%P%S

[em_certutil_decode]
button=%$System%\certutil.exe
cmd=%$System%\certutil.exe
menu=Decode Base64
param=-v -decode %P%S "%P%O"

[em_certutil_encode]
button=%$System%\certutil.exe
cmd=%$System%\certutil.exe
menu=Encode Base64
param=-v -encode %P%S %P%S.base64

[em_exeinfo]
{{- with $default := "%$UserProgramFiles%\\ExeinfoPe\\exeinfope.exe" }}
{{-   with $program := (default $default (lookPath "exeinfope.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Exeinfo PE
param=%P%S

[em_explorer]
button=%$Windows%\explorer.exe
cmd=%$Windows%\explorer.exe
menu=Windows Explorer
param=/select,%P%S

{{- with $hex }}

[em_hex]
{{-   if .icon }}
button={{ .icon }}
{{-   end }}
cmd={{ .exec }}
menu={{ .name }}
param="%P%S"
{{- end }}

[em_innounp]
{{- with $default := "%$UserProgramFiles%\\Innounp\\innounp.exe" }}
{{-   with $program := (default $default (lookPath "innounp.exe")) }}
button=%$ComSpec%
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Inno Setup Unpacker
param=-x -m -d"%O" -y %P%S

[em_mpv]
{{- with $default := ternary
  (printf "%s\\Programs\\mpv\\mpv.exe" $localAppData)
  "%$UserProgramFiles%\\mpv\\mpv.exe"
  (ne .chezmoi.os "windows") }}
{{-   with $program := (default $default (lookPath "mpv.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=mpv
{{- /* D3DMetal in CrossOver crashes mpv's Direct3D 11 renderer. */}}
param={{ if eq .chezmoi.os "darwin" }}--gpu-api=vulkan {{ end }}%P%S

[em_reshacker]
{{- with $default := "%$UserProgramFiles%\\Resource Hacker\\ResourceHacker.exe" }}
{{-   with $program := (default $default (lookPath "ResourceHacker.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Resource Hacker
param=%P%S

[em_sumatra]
{{- with $default := "%$UserProgramFiles%\\SumatraPDF\\SumatraPDF.exe" }}
{{-   with $program := (default $default (lookPath "SumatraPDF.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Sumatra PDF

[em_upx_pack]
{{- with $default := "%$UserProgramFiles%\\UPX\\upx.exe" }}
{{-   with $program := (default $default (lookPath "upx.exe")) }}
button=%$System%\zipfldr.dll
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Compress executable
param=--best %P%S

[em_upx_unpack]
{{- with $default := "%$UserProgramFiles%\\UPX\\upx.exe" }}
{{-   with $program := (default $default (lookPath "upx.exe")) }}
button=%$System%\zipfldr.dll
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Decompress executable
param=-d %P%S
