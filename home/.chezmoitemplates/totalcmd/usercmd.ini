{{- /* vim: set ft=dosini: */ -}}

{{- /* Windows paths as seen by Total Commander. */}}
{{- $localAppData := env "LocalAppData" }}
{{- $programFiles := env "ProgramFiles" }}
{{- if eq .chezmoi.os "darwin" }}
{{-   $localAppData = "C:\\users\\crossover\\AppData\\Local" }}
{{-   $programFiles = "C:\\Program Files" }}
{{- else if eq .chezmoi.os "linux" }}
{{-   $localAppData = printf "C:\\users\\%s\\AppData\\Local" .chezmoi.username }}
{{-   $programFiles = "C:\\Program Files" }}
{{- end }}

{{- /* The C: drive of the CrossOver bottle on macOS or the Wine prefix on Linux. */}}
{{- $driveC := "" }}
{{- if eq .chezmoi.os "darwin" }}
{{-   $driveC = printf "%s/Library/Application Support/CrossOver/Bottles/%s/drive_c"
        .chezmoi.homeDir .totalcmd.crossover.bottle }}
{{- else if eq .chezmoi.os "linux" }}
{{-   $driveC = joinPath .chezmoi.homeDir .totalcmd.wine.prefix "drive_c" }}
{{- end -}}

[em_baregrep]
{{- with $default := "%$UserProgramFiles%\\BareGrepPro\\BareGrepPro.exe" }}
{{-   with $program := (default $default (lookPath "BareGrepPro.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Grep in current directory
param=--directory "%P"

[em_baretail]
{{- with $default := "%$UserProgramFiles%\\BareTailPro\\BareTailPro.exe" }}
{{-   with $program := (default $default (lookPath "BareTailPro.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Tail selected files
param=%P%S

[em_certutil_decode]
button=%$System%\certutil.exe
cmd=%$System%\certutil.exe
menu=Decode Base64
param=-v -decode %P%S "%P%O"

[em_certutil_encode]
button=%$System%\certutil.exe
cmd=%$System%\certutil.exe
menu=Encode Base64
param=-v -encode %P%S %P%S.base64

[em_exeinfo]
{{- with $default := "%$UserProgramFiles%\\ExeinfoPe\\exeinfope.exe" }}
{{-   with $program := (default $default (lookPath "exeinfope.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Exeinfo PE
param=%P%S

[em_explorer]
button=%$Windows%\explorer.exe
cmd=%$Windows%\explorer.exe
menu=Windows Explorer
param=/select,%P%S

{{- with $hexEditors := tuple
  (dict "icon" "%$ComSpec%"
        "name" "Hacker's View"
        "home" (printf "%s\\Programs\\Hiew" $localAppData)
        "exec" "hiew.exe")
  (dict "name" "010 Editor"
        "home" (printf "%s\\010 Editor" $programFiles)
        "exec" "010Editor.exe") -}}
{{- "" }}
{{-   range $editor := $hexEditors }}
{{-     with $defaultPath := printf "%s\\%s" $editor.home $editor.exec }}
{{-       with $programPath := (default $defaultPath (lookPath $editor.exec)) }}
{{-         $found := lookPath $programPath }}
{{-         if $driveC }}
{{-           $hostPath := trimPrefix "C:\\" $programPath | replace "\\" "/" }}
{{-           $found = stat (printf "%s/%s" $driveC $hostPath) }}
{{-         end }}
{{-         if $found }}

[em_hex]
{{-           if index $editor "icon" }}
button={{ $editor.icon }}
{{-           end }}
cmd={{ $programPath }}
menu={{ $editor.name }}
param="%P%S"
{{-           break }}
{{-         end }}
{{-       end }}
{{-     end }}
{{-   end }}
{{- end }}

[em_innounp]
{{- with $default := "%$UserProgramFiles%\\Innounp\\innounp.exe" }}
{{-   with $program := (default $default (lookPath "innounp.exe")) }}
button=%$ComSpec%
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Inno Setup Unpacker
param=-x -m -d"%O" -y %P%S

[em_mpv]
{{- with $default := ternary
  (printf "%s\\Programs\\mpv\\mpv.exe" $localAppData)
  "%$UserProgramFiles%\\mpv\\mpv.exe"
  (ne .chezmoi.os "windows") }}
{{-   with $program := (default $default (lookPath "mpv.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=mpv
{{- /* D3DMetal in CrossOver crashes mpv's Direct3D 11 renderer. */}}
param={{ if eq .chezmoi.os "darwin" }}--gpu-api=vulkan {{ end }}%P%S

[em_reshacker]
{{- with $default := "%$UserProgramFiles%\\Resource Hacker\\ResourceHacker.exe" }}
{{-   with $program := (default $default (lookPath "ResourceHacker.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Resource Hacker
param=%P%S

[em_sumatra]
{{- with $default := "%$UserProgramFiles%\\SumatraPDF\\SumatraPDF.exe" }}
{{-   with $program := (default $default (lookPath "SumatraPDF.exe")) }}
button={{ $program }}
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Sumatra PDF

[em_upx_pack]
{{- with $default := "%$UserProgramFiles%\\UPX\\upx.exe" }}
{{-   with $program := (default $default (lookPath "upx.exe")) }}
button=%$System%\zipfldr.dll
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Compress executable
param=--best %P%S

[em_upx_unpack]
{{- with $default := "%$UserProgramFiles%\\UPX\\upx.exe" }}
{{-   with $program := (default $default (lookPath "upx.exe")) }}
button=%$System%\zipfldr.dll
cmd={{ $program }}
{{-   end }}
{{- end }}
menu=Decompress executable
param=-d %P%S
