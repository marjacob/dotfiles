env:
  TERM: xterm-256color

font:
  bold:
    family: {{ .font.name }}
    style: Bold
  bold_italic:
    family: {{ .font.name }}
    style: Bold Italic
  italic:
    family: {{ .font.name }}
    style: Italic
  normal:
    family: {{ .font.name }}
    style: Regular

  builtin_box_drawing: false
  draw_bold_text_with_bright_colors: true
  size: {{ .font.size }}
{{ if eq .chezmoi.os "windows" }}
shell:
  program: "C:\\Windows\\System32\\wsl.exe --cd ~"
{{ end }}
window:
  dimensions:
    columns: {{ .terminal.size.x }}
    lines: {{ .terminal.size.y }}
