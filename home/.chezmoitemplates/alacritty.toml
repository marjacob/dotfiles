[env]
TERM = "xterm-256color"

[font]
builtin_box_drawing = false
size = {{ .font.size }}

[font.bold]
family = {{ .font.name | quote }}
style = "Bold"

[font.bold_italic]
family = {{ .font.name | quote }}
style = "Bold Italic"

[font.italic]
family = {{ .font.name | quote }}
style = "Italic"

[font.normal]
family = {{ .font.name | quote }}
style = "Regular"

{{  if eq .chezmoi.os "windows" -}}
[terminal.shell]
{{ dict "program" (env "COMSPEC") | toToml }}
{{- end  }}

[window.dimensions]
columns = {{ .terminal.size.x }}
lines = {{ .terminal.size.y }}
